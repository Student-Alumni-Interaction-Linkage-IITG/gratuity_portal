{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>SAIL Gratitude Portal</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="SAIL Gratitude Portal">
    <meta name="description" content="Share your gratitude and write testimonials for your professors at IIT Guwahati.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'img/sail_logo.png' %}">
    <link rel="apple-touch-icon" href="{% static 'img/sail_logo.png' %}">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Global Design System -->
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    
    <script>
      // Apply theme before page renders to avoid FOUC
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    </script>

    {% block css %}{% endblock %}
</head>
<body>
    <!-- Abstract Background Elements -->
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>
    
    <!-- Main Content Area -->
    <div class="app-wrapper">
        {% block content %}
        <!-- Child templates will replace this -->
        {% endblock %}
    </div>

    <!-- Global Footer -->
    {% include "footer.html" %}


    <!-- Global Loading Screen -->
    {% include "components/loading_screen.html" %}

    <script>
        // Trigger loading screen on major navigation
        document.addEventListener('DOMContentLoaded', function() {
            const loadLinks = document.querySelectorAll('.nav-link, .btn-primary, .btn-google, .btn-microsoft');
            loadLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    if (this.hasAttribute('target') && this.getAttribute('target') === '_blank') return;
                    if (this.getAttribute('href') && this.getAttribute('href').startsWith('#')) return;
                    
                    showGlobalLoading();
                });
            });
        });
    </script>
</body>
</html>
