{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>SAIL Gratitude Portal</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="SAIL Gratitude Portal">
    <meta name="description" content="Share your gratitude and write testimonials for your professors at IIT Guwahati.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'img/sail_logo.png' %}">
    <link rel="apple-touch-icon" href="{% static 'img/sail_logo.png' %}">
    <!-- Preload Critical Assets -->
    <link rel="preload" href="{% static 'css/global.css' %}" as="style">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=optional" as="style">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=optional" rel="stylesheet">
    
    <!-- Global Design System -->
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    
    <script>
      // Apply theme before page renders to avoid FOUC
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    </script>

    {% block css %}{% endblock %}
</head>
<body>
    <!-- Abstract Background Elements -->
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>
    
    <!-- Main Content Area -->
    <div class="app-wrapper">
        {% block content %}
        <!-- Child templates will replace this -->
        {% endblock %}
    </div>

    <!-- Global Footer -->
    {% include "footer.html" %}


    <!-- Topbar Navigation Progress -->
    <div id="topbar-progress"></div>

    <style>
        #topbar-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: linear-gradient(90deg, var(--clr-primary), #3b82f6);
            z-index: 999999;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.7);
        }
    </style>

    <script>
        // Trigger subtle top-bar progress on navigation
        document.addEventListener('DOMContentLoaded', function() {
            const progress = document.getElementById('topbar-progress');
            let isNavigating = false;
            
            // Smoothly reveal the page when it initially loads
            document.body.classList.add('page-loaded');

            document.body.addEventListener('click', function(e) {
                // Find closest anchor tag
                const link = e.target.closest('a');
                if (!link) return;
                
                const href = link.getAttribute('href');
                if (!href || href.startsWith('#') || href.startsWith('javascript:')) return;
                if (link.getAttribute('target') === '_blank' || e.ctrlKey || e.metaKey) return;
                
                if (!isNavigating) {
                    isNavigating = true;
                    progress.style.opacity = '1';
                    progress.style.width = '30%';
                    
                    // Simulate progress
                    setTimeout(() => { if (isNavigating) progress.style.width = '60%'; }, 500);
                    setTimeout(() => { if (isNavigating) progress.style.width = '85%'; }, 1500);
                }
            });
            
            // Clean up on pageshow (e.g. back/forward cache)
            window.addEventListener('pageshow', function() {
                isNavigating = false;
                progress.style.width = '100%';
                setTimeout(() => {
                    progress.style.opacity = '0';
                    setTimeout(() => {
                        progress.style.width = '0%';
                    }, 300);
                }, 200);
            });
        });
    </script>
</body>
</html>
