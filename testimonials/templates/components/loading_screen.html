{% load static %}
<div id="globalLoadingScreen" class="global-loading-screen" style="display: none;">
    <!-- Abstract background elements -->
    <div class="ls-shape ls-shape-1"></div>
    <div class="ls-shape ls-shape-2"></div>

    <div class="ls-content">
        <div class="ls-logo-wrap">
            <img src="{% static 'img/iitg-logo.png' %}" alt="IITG Logo" class="ls-iitg-logo">
            <div class="ls-divider"></div>
            <img src="{% static 'img/sail_logo.png' %}" alt="SAIL Logo" class="ls-sail-logo">
        </div>
        
        <h2 class="ls-title">Gratitude Portal</h2>
        
        <div class="ls-indicator">
            <div class="ls-dot"></div>
            <div class="ls-dot"></div>
            <div class="ls-dot"></div>
        </div>
        <div class="ls-text">Loading...</div>
    </div>
</div>

<style>
    .global-loading-screen {
        position: fixed;
        inset: 0;
        background: #f8fafc;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.3s ease;
    }
    
    .global-loading-screen.is-active {
        display: flex !important;
        opacity: 1;
    }

    [data-theme="dark"] .global-loading-screen {
        background: #0f172a;
    }

    /* Abstract shapes */
    .ls-shape {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        z-index: -1;
        opacity: 0.5;
        animation: lsFloat 6s ease-in-out infinite alternate;
    }
    .ls-shape-1 {
        width: 300px; height: 300px;
        background: rgba(199,210,254,0.4);
        top: -100px; right: -50px;
    }
    .ls-shape-2 {
        width: 250px; height: 250px;
        background: rgba(187,247,208,0.3);
        bottom: -50px; left: -50px;
        animation-delay: -3s;
    }

    [data-theme="dark"] .ls-shape-1 { background: rgba(30,58,138,0.3); }
    [data-theme="dark"] .ls-shape-2 { background: rgba(22,101,52,0.2); }

    .ls-content {
        text-align: center;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .ls-logo-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        animation: lsPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .ls-iitg-logo { width: 50px; height: 50px; object-fit: contain; }
    .ls-sail-logo { width: 40px; height: 40px; object-fit: contain; }
    
    .ls-divider {
        width: 2px;
        height: 40px;
        background: rgba(15,44,89,0.2);
    }
    [data-theme="dark"] .ls-divider { background: rgba(255,255,255,0.2); }

    .ls-title {
        color: #0f2c59;
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0 0 32px 0;
        letter-spacing: -0.02em;
    }
    [data-theme="dark"] .ls-title { color: #f1f5f9; }

    .ls-indicator {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
    }
    .ls-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #2b7a4b;
        animation: lsBounce 1.4s infinite ease-in-out both;
    }
    .ls-dot:nth-child(1) { animation-delay: -0.32s; }
    .ls-dot:nth-child(2) { animation-delay: -0.16s; }
    .ls-dot:nth-child(3) { background-color: #0f2c59; }

    [data-theme="dark"] .ls-dot:nth-child(3) { background-color: #3b82f6; }

    .ls-text {
        color: #64748b;
        font-size: 0.9rem;
        font-weight: 500;
    }
    [data-theme="dark"] .ls-text { color: #94a3b8; }

    @keyframes lsFloat {
        0% { transform: translateY(0) scale(1); }
        100% { transform: translateY(-20px) scale(1.05); }
    }
    @keyframes lsPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
    }
    @keyframes lsBounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }
</style>

<script>
    function showGlobalLoading() {
        const loader = document.getElementById('globalLoadingScreen');
        if (loader) loader.classList.add('is-active');
    }
    function hideGlobalLoading() {
        const loader = document.getElementById('globalLoadingScreen');
        if (loader) loader.classList.remove('is-active');
    }
    
    window.addEventListener('pageshow', function(e) {
        hideGlobalLoading();
    });
</script>
