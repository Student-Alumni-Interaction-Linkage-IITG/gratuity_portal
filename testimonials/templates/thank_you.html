{% extends "base.html" %}

{% block content %}
{% include "nav_bar.html" %}
<div class="page-container" style="display: flex; align-items: center; justify-content: center; min-height: 70vh;">
    
    <div class="glass-card" style="max-width: 600px; text-align: center; padding: 60px 40px;">
        <!-- Animated Checkmark Icon -->
        <div style="width: 80px; height: 80px; background: rgba(42, 157, 143, 0.1); color: var(--clr-accent-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <h1 style="color: var(--clr-primary); font-size: 2.5rem; margin-bottom: 20px;">Thank You!</h1>
        <p style="color: var(--clr-text-muted); font-size: 1.2rem; line-height: 1.6; margin-bottom: 40px;">
            Your gratitude means the world. Your testimonial has been successfully submitted and is now visible to the professor on their dashboard.
        </p>

        <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
            <a href="{% url 'home' %}" class="btn btn-primary" style="font-size: 1.1rem; padding: 12px 30px;">
                Back to Home
            </a>
        </div>
    </div>
    
</div>
{% endblock %}
